<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VAWES - keresés</title>
<link rel="stylesheet" href="kereses.css">
</head>
<body>

<div class="main">
  <aside class="sidebar">
    <div class="brand">VAWES</div>
    <nav>
      <a href="VAWES.html">Főoldal</a>
      <a href="kereses.html" class="active">Keresés</a>
      <a href="konyvtar.html">Könyvtár</a>
    </nav>
    <p class="label">Lejátszási listák</p>
    <div class="pl-item"><span class="cover bg-violet"></span>Chill Waves</div>
    <div class="pl-item"><span class="cover bg-cyan"></span>Night Drive</div>
    <div class="pl-item"><span class="cover bg-pink"></span>Fókusz</div>
    <div class="pl-item"><span class="cover bg-orange"></span>Új felfedezések</div>
  </aside>

  <main class="content">
    <div class="search-box" id="searchBox">
      <span class="ico">🔍</span>
      <input id="q" type="search" placeholder="Szám, album vagy lista keresése" autocomplete="off" aria-label="Keresés">
      <button class="clear" id="clear" aria-label="Törlés">✕</button>
    </div>

    <div class="chips" id="chips"></div>

    <section id="browse">
      <h2>Böngészés lista szerint</h2>
      <div class="tiles" id="tiles"></div>
    </section>

    <section id="results" hidden>
      <h2 id="resTitle">Találatok</h2>
      <div id="resBody"></div>
    </section>
  </main>
</div>

<footer class="player">
  <div class="track-info">
    <span class="cover sm bg-violet" id="npCover"></span>
    <div><p id="npTitle">Midnight Waves</p><p class="muted" id="npAlbum">VAWES Mix</p></div>
  </div>
  <div class="controls">
    <button aria-label="Előző">⏮</button>
    <button id="playBtn" aria-label="Lejátszás">▶</button>
    <button aria-label="Következő">⏭</button>
  </div>
  <div class="progress">
    <span>1:24</span>
    <div class="bar"><i></i></div>
    <span id="npLen">3:31</span>
  </div>
</footer>
</body>
</html>
