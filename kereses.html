<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VAWES - keresés</title>
<link rel="stylesheet" href="kereses.css">
</head>
<body>

<div class="main">
  <aside class="sidebar">
    <div class="brand">VAWES</div>
    <nav>
      <a href="VAWES.html">Főoldal</a>
      <a href="kereses.html" class="active">Keresés</a>
      <a href="konyvtar.html">Könyvtár</a>
    </nav>
    <p class="label">Lejátszási listák</p>
    <div class="pl-item"><span class="cover bg-violet"></span>Chill Waves</div>
    <div class="pl-item"><span class="cover bg-cyan"></span>Night Drive</div>
    <div class="pl-item"><span class="cover bg-pink"></span>Fókusz</div>
    <div class="pl-item"><span class="cover bg-orange"></span>Új felfedezések</div>
  </aside>

  <main class="content">
    <div class="search-box" id="searchBox">
      <span class="ico">🔍</span>
      <input id="q" type="search" placeholder="Szám, album vagy lista keresése" autocomplete="off" aria-label="Keresés">
      <button class="clear" id="clear" aria-label="Törlés">✕</button>
    </div>

    <div class="chips" id="chips"></div>

    <section id="browse">
      <h2>Böngészés lista szerint</h2>
      <div class="tiles" id="tiles"></div>
    </section>

    <section id="results" hidden>
      <h2 id="resTitle">Találatok</h2>
      <div id="resBody"></div>
    </section>
  </main>
</div>

<footer class="player">
  <div class="track-info">
    <span class="cover sm bg-violet" id="npCover"></span>
    <div><p id="npTitle">Midnight Waves</p><p class="muted" id="npAlbum">VAWES Mix</p></div>
  </div>
  <div class="controls">
    <button aria-label="Előző">⏮</button>
    <button id="playBtn" aria-label="Lejátszás">▶</button>
    <button aria-label="Következő">⏭</button>
  </div>
  <div class="progress">
    <span>1:24</span>
    <div class="bar"><i></i></div>
    <span id="npLen">3:31</span>
  </div>
</footer>

<script>
  const LISTS = {
    'Chill Waves':     'bg-violet',
    'Night Drive':     'bg-cyan',
    'Fókusz':          'bg-pink',
    'Új felfedezések': 'bg-orange'
  };

  const TRACKS = [
    {t:'Midnight Waves', a:'VAWES Mix',   l:'3:31', pl:'Chill Waves'},
    {t:'Late Studio',    a:'Chill Waves', l:'2:58', pl:'Chill Waves'},
    {t:'Sunday Reset',   a:'Chill Waves', l:'4:02', pl:'Chill Waves'},
    {t:'Slow Fade',      a:'Chill Waves', l:'3:40', pl:'Chill Waves'},
    {t:'Deep Focus',     a:'Fókusz',      l:'3:47', pl:'Fókusz'},
    {t:'Morning Run',    a:'Night Drive', l:'3:12', pl:'Night Drive'}
    // Ide vehetsz fel további számokat: {t:'Cím', a:'Album', l:'3:00', pl:'Lista neve'}
  ];

  const $ = id => document.getElementById(id);
  const q = $('q'), box = $('searchBox');
  let activeList = null;
  let playingTitle = 'Midnight Waves';

  const norm = s => s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
  const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

  function highlight(text, query){
    if(!query) return esc(text);
    const n = norm(text), i = n.indexOf(norm(query));
    if(i < 0 || n.length !== text.length) return esc(text);
    return esc(text.slice(0,i)) + '<mark>' + esc(text.slice(i, i+query.length)) + '</mark>' + esc(text.slice(i+query.length));
  }

  // Szűrő chipek + csempék
  const chips = $('chips');
  function renderChips(){
    chips.innerHTML = '';
    ['Mind', ...Object.keys(LISTS)].forEach(name => {
      const b = document.createElement('button');
      b.className = 'chip' + ((name === 'Mind' && !activeList) || name === activeList ? ' on' : '');
      b.textContent = name;
      b.onclick = () => { activeList = name === 'Mind' ? null : name; renderChips(); update(); };
      chips.appendChild(b);
    });
  }
  Object.entries(LISTS).forEach(([name, color]) => {
    const b = document.createElement('button');
    b.className = 'tile ' + color; b.textContent = name;
    b.onclick = () => { activeList = name; renderChips(); update(); };
    $('tiles').appendChild(b);
  });

  function update(){
    const query = q.value.trim();
    box.classList.toggle('has-text', !!query);
    const showResults = query || activeList;
    $('browse').hidden = !!showResults;
    $('results').hidden = !showResults;
    if(!showResults) return;

    const nq = norm(query);
    const hits = TRACKS.filter(r =>
      (!activeList || r.pl === activeList) &&
      (!nq || norm(r.t).includes(nq) || norm(r.a).includes(nq) || norm(r.pl).includes(nq))
    );

    $('resTitle').textContent = hits.length ? `Találatok (${hits.length})` : 'Találatok';

    if(!hits.length){
      $('resBody').innerHTML = `<p class="empty">Nincs találat erre: <b>${esc(query || activeList)}</b>. Próbálj rövidebb szót, vagy válassz másik listát.</p>`;
      return;
    }

    $('resBody').innerHTML = `<table>
      <thead><tr><th>Cím</th><th class="col-album">Album</th><th>Lista</th><th>Hossz</th></tr></thead>
      <tbody>${hits.map(r => `
        <tr class="row${r.t === playingTitle ? ' playing' : ''}" data-t="${esc(r.t)}">
          <td><div class="t-cell"><span class="cover sm ${LISTS[r.pl]}"></span><span class="t">${highlight(r.t, query)}</span></div></td>
          <td class="col-album">${highlight(r.a, query)}</td>
          <td>${highlight(r.pl, query)}</td>
          <td>${r.l}</td>
        </tr>`).join('')}
      </tbody></table>`;

    $('resBody').querySelectorAll('tr.row').forEach(tr => {
      tr.onclick = () => play(TRACKS.find(r => r.t === tr.dataset.t));
    });
  }

  function play(r){
    playingTitle = r.t;
    $('npTitle').textContent = r.t;
    $('npAlbum').textContent = r.a;
    $('npLen').textContent = r.l;
    $('npCover').className = 'cover sm ' + LISTS[r.pl];
    $('playBtn').textContent = '⏸';
    update();
  }

  q.addEventListener('input', update);
  $('clear').onclick = () => { q.value = ''; q.focus(); update(); };
  document.addEventListener('keydown', e => { if(e.key === '/' && document.activeElement !== q){ e.preventDefault(); q.focus(); } });

  const btn = $('playBtn');
  btn.addEventListener('click', () => { btn.textContent = btn.textContent === '▶' ? '⏸' : '▶'; });

  renderChips();
  update();
  q.focus();
</script>
</body>
</html>
